services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseProvider=Sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/data/hostelsystem.db
      - Jwt__Secret=DEV-SECRET-KEY-CHANGE-IN-PRODUCTION-AT-LEAST-32-CHARS!!
      - Jwt__Issuer=HostelSystem.Api
      - Jwt__Audience=HostelSystem.Web
      - Paystack__SecretKey=${PAYSTACK_SECRET_KEY:-}
      - Paystack__PublicKey=${PAYSTACK_PUBLIC_KEY:-}
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || wget -qO- http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiBaseUrl=http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || wget -qO- http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Production profile: SQL Server (activate with --profile prod) ──
  # Run: docker compose --profile prod up
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["prod"]
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlite-data:
  mssql-data:
