services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/hostelsystem.db
      - Jwt__Secret=DEV-SECRET-KEY-CHANGE-IN-PRODUCTION-AT-LEAST-32-CHARS!!
      - Jwt__Issuer=HostelSystem.Api
      - Jwt__Audience=HostelSystem.Web
    volumes:
      - sqlite-data:/data

volumes:
  sqlite-data:
